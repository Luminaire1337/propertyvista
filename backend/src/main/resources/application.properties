# Core
spring.application.name=Property Vista - Backend API
propertyvista.frontend.url=${PROPERTYVISTA_FRONTEND_URL:http://localhost:5173}
propertyvista.storage.url=${PROPERTYVISTA_STORAGE_URL:http://localhost:9000}
# Logging
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n
# Profiles
spring.profiles.default=dev
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
# Actuator
management.endpoints.web.exposure.include=health
# Database
spring.datasource.url=${SPRING_DATABASE_URL:jdbc:mariadb://localhost:3306/propertyvista}
spring.datasource.username=${SPRING_DATABASE_USERNAME:propertyvista}
spring.datasource.password=${SPRING_DATABASE_PASSWORD:propertyvista}
# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true
# Flyway
spring.flyway.enabled=true
# JWT
propertyvista.jwt.secret=${PROPERTYVISTA_JWT_SECRET:CHANGEMECHANGEMECHANGEMECHANGEME}
propertyvista.jwt.expiration-ms=${PROPERTYVISTA_JWT_EXPIRATION_MS:86400000}
# Mail
spring.mail.host=${SPRING_MAIL_HOST:localhost}
spring.mail.port=${SPRING_MAIL_PORT:1025}
spring.mail.username=${SPRING_MAIL_USERNAME:mailpit}
spring.mail.password=${SPRING_MAIL_PASSWORD:mailpit}
spring.mail.properties.transport.protocol=smtp
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
propertyvista.mail.from=${PROPERTYVISTA_MAIL_FROM:noreply@propertyvista.local}
# Storage
propertyvista.storage.access-key=${PROPERTYVISTA_STORAGE_ACCESS_KEY:storageaccesskey}
propertyvista.storage.secret-key=${PROPERTYVISTA_STORAGE_SECRET_KEY:storagesecretkey}