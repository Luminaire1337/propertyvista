# Core
spring.application.name=Property Vista - Backend API
# Logging
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n
# Profiles
spring.profiles.default=dev
spring.profiles.active=${SPRING_PROFILES_ACTIVE}
# Actuator
management.endpoints.web.exposure.include=health
# Database
spring.datasource.url=${SPRING_DATABASE_URL}
# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true
# Flyway
spring.flyway.enabled=true
# Mail
spring.mail.host=${SPRING_MAIL_HOST}
spring.mail.port=${SPRING_MAIL_PORT}
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.transport.protocol=smtp
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
management.health.mail.enabled=false
# Cache
spring.data.redis.url=${SPRING_REDIS_URL}
# Uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=20MB
server.tomcat.max-part-count=30