services:
  traefik:
    image: traefik:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "8080:8080" # Traefik dashboard
    environment:
      - TZ=Europe/Warsaw
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    labels:
      - "traefik.enable=true"
      # CORS middleware configuration
      - "traefik.http.middlewares.cors-headers.headers.accesscontrolallowmethods=GET,POST,PUT,DELETE,OPTIONS"
      - "traefik.http.middlewares.cors-headers.headers.accesscontrolalloworiginlist=http://localhost"
      - "traefik.http.middlewares.cors-headers.headers.accesscontrolallowheaders=Authorization,Content-Type"
      - "traefik.http.middlewares.cors-headers.headers.accesscontrolallowcredentials=false"
      - "traefik.http.middlewares.cors-headers.headers.accesscontrolmaxage=3600"
      # Rate limiting middleware - 100 requests per second average, burst of 50
      - "traefik.http.middlewares.rate-limit.ratelimit.average=100"
      - "traefik.http.middlewares.rate-limit.ratelimit.burst=50"
      - "traefik.http.middlewares.rate-limit.ratelimit.period=1s"

  backend:
    build:
      context: ./backend
      dockerfile: ./docker/prod/Dockerfile
    container_name: propertyvista-backend
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      - TZ=Europe/Warsaw
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATABASE_URL=jdbc:mariadb://database:3306/${DB_NAME}?user=${DB_USER}&password=${DB_PASSWORD}
      - SPRING_MAIL_HOST=${MAIL_HOST}
      - SPRING_MAIL_PORT=${MAIL_PORT}
      - SPRING_MAIL_USERNAME=${MAIL_USERNAME}
      - SPRING_MAIL_PASSWORD=${MAIL_PASSWORD}
      # Custom variables
      - PROPERTYVISTA_JWT_SECRET=${JWT_SECRET}
      - PROPERTYVISTA_JWT_EXPIRATION_MS=${JWT_EXPIRATION_MS}
      - PROPERTYVISTA_FRONTEND_URL=http://localhost
      - PROPERTYVISTA_MAIL_FROM=${MAIL_FROM}
      - PROPERTYVISTA_STORAGE_URL=http://storage:9000
      - PROPERTYVISTA_PUBLIC_STORAGE_URL=https://storage.localhost
      - PROPERTYVISTA_STORAGE_ACCESS_KEY=${STORAGE_ACCESS_KEY}
      - PROPERTYVISTA_STORAGE_SECRET_KEY=${STORAGE_SECRET_KEY}
      - PROPERTYVISTA_GOOGLE_CLOUD_KEY=${GOOGLE_CLOUD_KEY}
    depends_on:
      database:
        condition: service_healthy
      storage:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`api.localhost`)"
      - "traefik.http.routers.backend.entrypoints=web"
      - "traefik.http.routers.backend.priority=10"
      - "traefik.http.services.backend.loadbalancer.server.port=8080"
      - "traefik.http.routers.backend.middlewares=cors-headers,rate-limit"

  frontend:
    build:
      context: ./frontend
      dockerfile: ./docker/prod/Dockerfile
      args:
        - VITE_API_URL=http://api.localhost
    restart: unless-stopped
    expose:
      - "80"
    environment:
      - TZ=Europe/Warsaw
    depends_on:
      backend:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`localhost`)"
      - "traefik.http.routers.frontend.entrypoints=web"
      - "traefik.http.routers.frontend.priority=1"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"
      - "traefik.http.routers.frontend.middlewares=cors-headers,rate-limit"