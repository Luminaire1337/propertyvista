services:
  backend:
    build:
      context: ./backend
      dockerfile: ./docker/dev/Dockerfile
    restart: unless-stopped
    volumes:
      - ./backend/src:/app/src:ro
      - maven_cache:/home/ubuntu/.m2
    ports:
      - "8080:8080"
      - "5005:5005" # for remote debugging
    environment:
      - TZ=Europe/Warsaw
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_DATABASE_URL=jdbc:mariadb://database:3306/${DB_NAME}?user=${DB_USER}&password=${DB_PASSWORD}
      - SPRING_MAIL_HOST=${MAIL_HOST}
      - SPRING_MAIL_PORT=${MAIL_PORT}
      - SPRING_MAIL_USERNAME=${MAIL_USERNAME}
      - SPRING_MAIL_PASSWORD=${MAIL_PASSWORD}
      # Custom variables
      - PROPERTYVISTA_JWT_SECRET=${JWT_SECRET}
      - PROPERTYVISTA_JWT_EXPIRATION_MS=${JWT_EXPIRATION_MS}
      - PROPERTYVISTA_FRONTEND_URL=http://localhost:5173
      - PROPERTYVISTA_MAIL_FROM=${MAIL_FROM}
      - PROPERTYVISTA_STORAGE_URL=http://storage:9000
      - PROPERTYVISTA_PUBLIC_STORAGE_URL=http://localhost:9000
      - PROPERTYVISTA_STORAGE_ACCESS_KEY=${STORAGE_ACCESS_KEY}
      - PROPERTYVISTA_STORAGE_SECRET_KEY=${STORAGE_SECRET_KEY}
      - PROPERTYVISTA_GOOGLE_CLOUD_KEY=${GOOGLE_CLOUD_KEY}
      - PROPERTYVISTA_FIRST_USER_EMAIL=${FIRST_USER_EMAIL}
      - PROPERTYVISTA_FIRST_USER_PASSWORD=${FIRST_USER_PASSWORD}
    depends_on:
      database:
        condition: service_healthy
      storage:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: ./docker/dev/Dockerfile
    restart: unless-stopped
    volumes:
      - ./frontend/src:/app/src:ro
      - ./frontend/index.html:/app/index.html:ro
      - ./frontend/vite.config.ts:/app/vite.config.ts:ro
    ports:
      - "5173:5173"
    environment:
      - TZ=Europe/Warsaw
      - VITE_API_URL=http://localhost:8080
    depends_on:
      backend:
        condition: service_started # no healthcheck in dev

volumes:
  maven_cache:
