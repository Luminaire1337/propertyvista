services:
  backend:
    build:
      context: ./backend
      dockerfile: ./docker/dev/Dockerfile
    restart: unless-stopped
    volumes:
      - ./backend/src:/app/src:ro
      - maven_cache:/home/docker/.m2
    ports:
      - "8080:8080"
      - "5005:5005" # for remote debugging
    environment:
      - TZ=Europe/Warsaw
      - SPRING_PROFILES_ACTIVE=dev
      - PROPERTYVISTA_FRONTEND_URL=http://localhost:5173
      - PROPERTYVISTA_STORAGE_URL=http://storage:9000
      - SPRING_DATABASE_URL=jdbc:mariadb://database:3306/${DB_NAME:-propertyvista}
      - SPRING_DATABASE_USERNAME=${DB_USER:-propertyvista}
      - SPRING_DATABASE_PASSWORD=${DB_PASSWORD:-propertyvista}
      - PROPERTYVISTA_JWT_SECRET=${JWT_SECRET:-CHANGEMECHANGEMECHANGEMECHANGEME}
      - PROPERTYVISTA_JWT_EXPIRATION_MS=${JWT_EXPIRATION_MS:-864000000} # 1 day
      - SPRING_MAIL_HOST=mailpit
      - SPRING_MAIL_PORT=1025
      - SPRING_MAIL_USERNAME=mailpit
      - SPRING_MAIL_PASSWORD=mailpit
      - PROPERTYVISTA_MAIL_FROM=noreply@propertyvista.com
      - PROPERTYVISTA_STORAGE_ACCESS_KEY=${STORAGE_ACCESS_KEY:-storageaccesskey}
      - PROPERTYVISTA_STORAGE_SECRET_KEY=${STORAGE_SECRET_KEY:-storagesecretkey
    depends_on:
      database:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: ./docker/dev/Dockerfile
    restart: unless-stopped
    volumes:
      - ./frontend/src:/app/src:ro
      - ./frontend/index.html:/app/index.html:ro
      - ./frontend/vite.config.ts:/app/vite.config.ts:ro
    ports:
      - "5173:5173"
    environment:
      - TZ=Europe/Warsaw
      - VITE_API_URL=http://localhost:8080
    depends_on:
      backend:
        condition: service_started

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    volumes:
      - mailpit_data:/data
    ports:
      - "8025:8025"  # Web interface
      - "1025:1025"  # SMTP
    environment:
      - TZ=Europe/Warsaw
      - MP_MAX_MESSAGES=5000
      - MP_DATABASE=/data/mailpit.db
      - MP_SMTP_AUTH_ACCEPT_ANY=1
      - MP_SMTP_AUTH_ALLOW_INSECURE=1

volumes:
  maven_cache:
  mailpit_data: